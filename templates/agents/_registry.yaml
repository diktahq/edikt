# Agent registry — maps stacks to recommended agents
# Format: category: [agent-slugs]
#
# Used by edikt:init to select which agents to install based on detected stack.
# Agent templates are at templates/agents/{slug}.md
# No agent has a model: field — model is per plan phase.

# Always installed for every project.
# Includes the system agents that tier-1 commands dispatch via Task
# subagent_type (evaluator, sidecar-extractor, governance-verifier,
# post-flight-synthesizer) — their dispatch cannot resolve unless they are
# installed, so they ship with every project (ADR-043).
#
# compile-quality-grader joins them under ADR-044, which reverses ADR-043
# Decision #2. That exclusion rested on the premise that the tier-2 Go loaded
# these templates directly via `claude -p` rather than via Task — a premise
# ADR-044 removed, because a tier-2 binary must never dispatch an LLM
# (INV-012). The grader is now dispatched from commands/gov/grade-compile.md,
# so it must be installed or the dispatch silently fails to resolve.
#
# cheat-rate-adversary joins them for the same reason: ADR-044 deleted its
# in-binary dispatcher too, so commands/gov/benchmark.md now dispatches it via
# Task and the registration must exist or that dispatch silently fails to
# resolve. Registration and dispatch moved together, in the same change.
always:
  - architect
  - docs
  - qa
  - evaluator
  - sidecar-extractor
  - governance-verifier
  - post-flight-synthesizer
  - compile-quality-grader
  - cheat-rate-adversary

# Installed for most non-trivial projects
common:
  - sre
  - security
  - pm
  - api

# Installed when these languages/frameworks are detected
go:
  - backend
  - dba

typescript:
  - frontend
  - backend

python:
  - backend
  - dba

php:
  - backend

ruby:
  - backend

java:
  - backend
  - dba

rust:
  - backend

# Frontend frameworks
react:
  - frontend
  - ux

nextjs:
  - frontend
  - ux
  - seo

vue:
  - frontend
  - ux

angular:
  - frontend
  - ux

svelte:
  - frontend
  - ux

# Mobile
react-native:
  - mobile
  - ux

flutter:
  - mobile
  - ux

swift:
  - mobile

kotlin:
  - mobile

# Infrastructure triggers
docker:
  - platform

kubernetes:
  - platform
  - sre

terraform:
  - platform

# Content/web triggers
web:
  - seo
  - gtm

# Data triggers
data-pipeline:
  - data

# Installed when project-context.md mentions these keywords
security-keywords:
  - security

compliance-keywords:
  - compliance

# Available but not auto-installed — add with /edikt:agents add {slug}
optional:
  - performance
  - data
  - compliance
  - mobile
  - seo
  - gtm
